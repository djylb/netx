version: "2"

linters:
  default: all
  disable:
    # Formatting and naming style that gofmt and the code's idiom already
    # settle: blank-line placement, short names in short scopes, the
    # if err := f(); err != nil form, embedded-field spacing.
    - wsl
    - wsl_v5
    - nlreturn
    - varnamelen
    - noinlineerr
    - embeddedstructfieldcheck
    - lll
    # Zero values are ready to use throughout the package; literals name
    # only the fields they set.
    - exhaustruct
    - exhaustruct_v5
    # The hot paths and the parsers are written out in one function on
    # purpose, so that the fast path stays inlined and free of calls; size
    # metrics flag exactly those.
    - cyclop
    - gocognit
    - gocyclo
    - nestif
    - funlen
    - maintidx
    # No import rules: the module's packages import each other freely and
    # the root module has a single dependency.
    - depguard
    # Deprecated, replaced by gomodguard_v2.
    - gomodguard
    # Package state is deliberate: pooled buffers and shared sentinels.
    - gochecknoglobals
    # Constants are explained where they are used.
    - mnd
    # Type assertions are on values the package itself stored (pool items,
    # option values it classified); a mismatch is a bug that must panic.
    - forcetypeassert
    # The wrappers return the errors of the connections they wrap as they
    # are, so that callers see the same errors as without them.
    - wrapcheck
    # Generic accessors (ConnAs) and clock providers return interfaces by
    # design.
    - ireturn
    # Functions are ordered by topic, next to the code they serve.
    - funcorder
    # Package-prefixed errors.New values are returned where they arise;
    # callers never match them, so sentinel variables would only add
    # package state.
    - err113
    # Tests measure timing, share loopback ports and drive fake clocks;
    # running them in parallel would distort what they measure. Internal tests need the
    # package's unexported state.
    - paralleltest
    - tparallel
    - testpackage
    # Named results document what a function returns.
    - nonamedreturns
    # Functions that find nothing return a nil value and a nil error; the
    # doc comments say so, and a sentinel would only be tested and dropped.
    - nilnil
  settings:
    govet:
      enable-all: true
      disable:
        # Checked on its own, as fieldalignment; what remains are
        # pointer-byte reports, for which fields keep their order of
        # meaning.
        - fieldalignment
    exhaustive:
      default-signifies-exhaustive: true
    errorlint:
      # Readers return io.EOF itself, never wrapped, and the code compares
      # it as the io.Reader contract tells; a wrapped io.EOF is not one.
      comparison: false
    gosec:
      excludes:
        # The encoders store the low bytes of lengths and values that the
        # code has checked against the field's range; truncating is the
        # encoding, and most conversions are on bytes and shifts.
        - G115
    thelper:
      tb:
        # testing.TB parameters are named t as the tests' other helpers
        # name theirs.
        name: false
    dupword:
      ignore:
        # The certificate ranking tests name a candidate "default".
        - default
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # These packages carry no net/http import, so as not to pull it into
      # programs that do not use it; method and header names are literals.
      - path: ^(httpproxy|wsconn|httphead)/[^/]*\.go$
        linters:
          - usestdlibvars
      # The transparent package reads and writes kernel structures through
      # syscalls, which is what unsafe is for there.
      - path: ^transparent/
        linters:
          - gosec
        text: G103
      # So does the batch read of a PacketListener, through recvmmsg.
      - path: ^listener_packet_batch_linux\.go$
        linters:
          - gosec
        text: G103
      # Tests listen and dial on loopback with the plain net functions, bind
      # and configure TLS as the test needs (self-signed, unverified), use
      # local paths and weak randomness, and run the test binary by path.
      - path: _test\.go
        linters:
          - noctx
          - gosec
      # Examples that listen on a port or dial out are compiled but have no
      # output to check, and end with log.Fatal as examples do.
      - path: _test\.go
        linters:
          - testableexamples
      - path: example.*_test\.go
        linters:
          - gocritic
        text: exitAfterDefer
      # The tests read responses from raw connections that they close with
      # the connection, and hand-build responses without a body to close.
      - path: _test\.go
        linters:
          - bodyclose
      # Tests reuse err in inner scopes, and the examples set fields to show
      # how to configure them.
      - path: _test\.go
        linters:
          - govet
        text: "^(shadow|unusedwrite):"
      # Handlers and fakes take the parameters their interface gives.
      - path: _test\.go
        linters:
          - revive
        text: "unused-parameter|context-as-argument"
      # Helpers take the values that the test around them happens to use;
      # slices that the tests build are short.
      - path: _test\.go
        linters:
          - unparam
          - prealloc
      # The tests check internationalized names and non-ASCII payloads.
      - path: _test\.go
        linters:
          - gosmopolitan
      # Tests send header names in the form that is under test.
      - path: _test\.go
        linters:
          - canonicalheader
      # Tests wait for a goroutine on its done channel, of errors that the
      # test does not look at.
      - path: _test\.go
        linters:
          - errcheck
        text: "Error return value is not checked"
      # Tests build errors in place, repeat their case names and unpack
      # fixtures they partly ignore.
      - path: (_test\.go|internal/leakcheck/)
        linters:
          - err113
          - goconst
          - dogsled

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
